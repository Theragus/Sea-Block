name: 💡 Suggestion or balance feedback
description: Something feels too slow, too expensive or too easy, an idea for a change, or support for another mod.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Sea Block for Factorio 2.1 hasn't had a full playthrough yet, so feedback from real games is especially welcome.

        Some balance work is already planned upstream, in the [Sea Block 2.0 milestone](https://github.com/modded-factorio/SeaBlock/milestone/18).

  - type: dropdown
    id: kind
    attributes:
      label: What kind of suggestion?
      options:
        - "Balance: something is too slow, too expensive or too easy"
        - A new feature or a change
        - Support for another mod
        - Something else
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your suggestion
      description: What would you change? For another mod, include its name or a link.
      placeholder: Landfill could unlock before green science, because expanding the island is the whole game.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What happened in your game that made you think of this?
      placeholder: I ran out of space on the starting island long before I could make green science.

  - type: dropdown
    id: progress
    attributes:
      label: How far is your game?
      options:
        - Just started, before red science
        - Red science
        - Green science
        - Blue science
        - Purple or yellow science
        - Rocket or endgame

  - type: dropdown
    id: sct
    attributes:
      label: Is ScienceCostTweaker enabled?
      description: It changes research costs a lot, which matters for balance. Look for "ScienceCostTweaker Mod (mexmer)" under Main menu → Mods.
      options:
        - "Yes"
        - "No"
        - Not sure

  - type: input
    id: sea-block-version
    attributes:
      label: Sea Block version
      description: Main menu → Mods, then find Sea Block in the list.
      placeholder: 2.1.3

  - type: input
    id: portal-thread
    attributes:
      label: Mod portal thread
      description: Already posted this on the mod portal? Paste the link so we can reply in both places.
      placeholder: https://mods.factorio.com/mod/SeaBlock21/discussion/...
